<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <meta name="description" content="pixiSnake multiplayer — a shared-arena snake battle built with Pixi.js.">
    <meta name="theme-color" content="#101510">
    <meta property="og:type" content="website">
    <meta property="og:title" content="pixiSnake — Multiplayer">
    <meta property="og:description" content="A shared-arena multiplayer snake battle built with Pixi.js.">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #101510;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: Arial, Helvetica, sans-serif;
      }
      /* Поле и панель счёта не пересекаются: панель — сбоку (ландшафт/десктоп)
         или сверху (портрет/мобила), поле всегда видно целиком. */
      body {
        display: flex;
        flex-direction: row;
        height: 100vh;
        width: 100vw;
      }
      #panel {
        flex: 0 0 200px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        background: #0c0f0c;
        overflow: auto;
      }
      #stage {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        position: relative;
        overflow: hidden;
      }
      /* заполняет всё поле-область, центрует canvas */
      #game-container {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container canvas {
        display: block;
        touch-action: none; /* иначе браузер перехватит свайпы под скролл/зум */
      }

      /* кнопка выхода и счёт */
      .btn {
        font-family: inherit;
        font-size: 15px;
        font-weight: bold;
        color: #101510;
        background: #4caf50;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        cursor: pointer;
      }
      .btn:hover { background: #66bb6a; }

      #exit-btn { align-self: stretch; text-align: center; }

      #scoreboard {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #scoreboard .sb-title {
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #7ddc7d;
      }
      .sb-row {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #ffffff;
        font-size: 14px;
        white-space: nowrap;
      }
      .sb-row.me { font-weight: bold; }
      .sb-row.dead { opacity: 0.45; }
      .sb-swatch {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        flex: 0 0 auto;
      }
      .sb-name {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 120px;
      }
      .sb-score {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
      }
      #controls-hint {
        margin-top: auto;
        font-size: 12px;
        color: #ffffff;
        opacity: 0.6;
      }

      /* сообщения о подключении — поверх поля */
      #status {
        position: absolute;
        top: 12px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: clamp(16px, 4vmin, 24px);
        font-weight: bold;
        color: #ffffff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        z-index: 4;
      }

      /* экран Game Over выбывшего игрока — поверх поля, остальных не трогает */
      #gameover-overlay {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(16, 21, 16, 0.88);
        z-index: 5;
      }
      #gameover-overlay.show { display: flex; }
      #gameover-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 28px 36px;
        background: #101510;
        border: 2px solid #4caf50;
        border-radius: 8px;
        text-align: center;
      }
      #gameover-panel .go-title {
        font-size: 30px;
        font-weight: bold;
        color: #ffffff;
      }
      #gameover-panel .go-score {
        font-size: 18px;
        color: #7ddc7d;
      }

      /* оверлей ввода имени — те же стили, что в одиночной игре (askPlayerName) */
      #name-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(16, 21, 16, 0.85);
        z-index: 6;
      }
      #name-overlay form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px 32px;
        background: #101510;
        border: 2px solid #4caf50;
        border-radius: 8px;
      }
      #name-overlay .name-title {
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #7ddc7d;
      }
      #name-overlay input {
        width: 200px;
        padding: 8px 10px;
        font-size: 16px;
        color: #ffffff;
        background: #1a241a;
        border: 1px solid #4caf50;
        border-radius: 4px;
        outline: none;
        text-align: center;
      }
      #name-overlay button {
        padding: 8px 28px;
        font-size: 16px;
        font-weight: bold;
        color: #101510;
        background: #4caf50;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #name-overlay button:hover { background: #66bb6a; }

      /* портрет/мобила: панель уезжает наверх горизонтальной полосой */
      @media (orientation: portrait) {
        body { flex-direction: column; }
        #panel {
          flex: 0 0 auto;
          width: 100%;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
          gap: 8px 16px;
        }
        #exit-btn { align-self: auto; }
        #scoreboard {
          flex-direction: row;
          flex-wrap: wrap;
          gap: 4px 14px;
        }
        #controls-hint { margin-top: 0; width: 100%; }
      }
    </style>
</head>
<body>
    <div id="panel">
        <button id="exit-btn" class="btn" type="button">← Exit</button>
        <div id="scoreboard"></div>
        <div id="controls-hint">Arrows or WASD to steer</div>
    </div>
    <div id="stage">
        <div id="game-container"></div>
        <div id="status"></div>
        <div id="gameover-overlay">
            <div id="gameover-panel">
                <div class="go-title">Game Over</div>
                <div class="go-score">Your score: <span id="go-score-val">0</span></div>
                <button id="play-again-btn" class="btn" type="button">Play again</button>
            </div>
        </div>
    </div>
</body>
</html>
