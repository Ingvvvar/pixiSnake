# Контейнерный стек рекордов: api + своя база. Работает параллельно с
# хост-версией (PM2 + хост-Postgres на 3000) — наружу торчит только 3010.
# Переменные берутся из .env рядом с этим файлом (см. .env.example).
services:
  api:
    build: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      # внутри контейнера слушаем все интерфейсы, иначе проброс порта не работает
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # порт наружу сознательно не публикуется: база доступна только api по
    # внутренней сети компоуза
    healthcheck:
      # $$ — чтобы переменные раскрывал шелл внутри контейнера, а не компоуз
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
