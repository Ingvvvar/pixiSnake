name: Deploy static to VPS

on:
  push:
    branches: [development]

# одновременно держим только один деплой; новый пуш отменяет предыдущий
# незавершённый — чтобы две заливки не топтали /var/www/snake одновременно
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # npm ci детерминированно ставит ровно то, что в package-lock.json
      - name: Install dependencies
        run: npm ci

      # webpack в проде кладёт бандлы с contenthash в dist/ (clean: true)
      - name: Build
        run: npm run build

      - name: Setup SSH key & known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # заранее кладём ключ хоста в known_hosts: иначе первый деплой упёрся бы
          # в интерактивный запрос StrictHostKeyChecking и зависший шаг свалился бы
          # по таймауту. 2>/dev/null глушит прогресс-вывод ssh-keyscan в stderr.
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy dist/ via rsync
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # accept-new — страховка на случай, если ssh-keyscan выше ничего не вернул
          # (первый деплой): ключ примется автоматически, но смена ключа всё равно
          # оборвёт соединение (защита от MITM).
          SSH_OPTS="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
          # --delete вычищает устаревшие contenthash-бандлы из прошлых сборок,
          # иначе старые index.<hash>.js копились бы в /var/www/snake без конца.
          # trailing slash у dist/ — копируем содержимое, а не саму папку.
          rsync -avz --delete -e "$SSH_OPTS" \
            dist/ "$SERVER_USER@$SERVER_HOST:/var/www/snake/"
          # права на чтение всем + проход по директориям для веб-сервера
          $SSH_OPTS "$SERVER_USER@$SERVER_HOST" "chmod -R a+rX /var/www/snake"
